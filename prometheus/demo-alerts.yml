# Symptom alerts for the OpenTelemetry Demo shop (Lab 4). They read the span metrics the demo's collector derives
# from traces (every 60 s, so windows are 5 minutes); only SERVER spans count, so the load generator's own failed
# calls to an agent that minimal mode does not run never page anyone.
groups:
  - name: shop-symptoms
    rules:
      # the customer cannot pay: a page
      - alert: ShopCheckoutErrors
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
          > 0.05
        for: 1m
        labels:
          service: checkout
          system: shop
          severity: P1
        annotations:
          summary: "More than 5 % of checkout requests fail"
      # the customer waits at checkout: a page too (added after the pilot incident: its shipping slowdown alone would
      # have paged no one); the healthy shop's checkout p99 stays under 0.4 s, a slow fault's goes above 5 s
      - alert: ShopCheckoutSlow
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m])))
          > 3000
        for: 2m
        labels:
          service: checkout
          system: shop
          severity: P1
        annotations:
          summary: "Checkout's p99 is above 3 s"
      # any shop service answering errors: chat, and muted while checkout already pages
      - alert: ShopServiceErrors
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))
          > 0.03
        for: 2m
        labels:
          service: shop
          system: shop
          severity: P2
        annotations:
          summary: "A shop service answers more than 3 % errors"
      # a slow backend: chat
      - alert: ShopServiceSlow
        expr: |
          histogram_quantile(0.99, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[5m])))
          > 2000
        for: 2m
        labels:
          service: shop
          system: shop
          severity: P2
        annotations:
          summary: "A shop service's p99 is above 2 s"
